<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script>
    // `base` below must match vite.config.js's `base` (minus the trailing
    // slash). If the repo is renamed, update both files together.
    var path = window.location.pathname;
    var base = '/Apartment';
    var redirectPath = path.replace(base, '') || '/';
    window.location.replace(base + '/?p=' + encodeURIComponent(redirectPath));
  </script>
</head>
<body></body>
</html>
